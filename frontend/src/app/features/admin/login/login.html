<div class="login-pagina">
    <div class="login-visual">
        <div class="login-visual__overlay"></div>
        <div class="login-visual__texto">
            <span class="login-visual__marca">Móveis Soares</span>
            <p class="login-visual__frase">Móveis que contam histórias, em cada detalhe da sua casa.</p>
        </div>
    </div>

    <div class="login-formulario">
        <form class="login-card" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
            <h1 class="login-titulo">Painel Administrativo</h1>
            <p class="login-subtitulo">Entre com suas credenciais para continuar</p>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" formControlName="email" autocomplete="username">
            </div>

            <div class="campo">
                <label for="password">Senha</label>
                <input type="password" id="password" formControlName="password" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-entrar" [disabled]="enviando()">
                {{ enviando() ? 'Entrando...' : 'Entrar' }}
            </button>
        </form>
    </div>
</div>
