<div class="login-pagina">
    <form class="login-card" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
        <h1 class="login-titulo">Painel Administrativo</h1>
        <p class="login-subtitulo">Móveis Soares</p>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" formControlName="email" autocomplete="username">
        </div>

        <div class="campo">
            <label for="password">Senha</label>
            <input type="password" id="password" formControlName="password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-entrar" [disabled]="enviando()">
            {{ enviando() ? 'Entrando...' : 'Entrar' }}
        </button>
    </form>
</div>
