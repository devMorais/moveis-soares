<div class="categorias-pagina">
    <h1>Categorias</h1>
    <p class="categorias-pagina__descricao">
        Organize seu catálogo por categoria. Categorias com produtos cadastrados não podem ser removidas.
    </p>

    <form [formGroup]="form" (ngSubmit)="salvar()" class="form-categoria">
        <div class="campo">
            <label for="nome">Nome da categoria</label>
            <input type="text" id="nome" formControlName="nome">
        </div>
        <div class="campo">
            <label for="slug">Slug (opcional)</label>
            <input type="text" id="slug" formControlName="slug" placeholder="Gerado a partir do nome, se deixado em branco">
        </div>
        <label class="campo-checkbox">
            <input type="checkbox" formControlName="ativo">
            Ativa (aparece no site)
        </label>
        <div class="campo campo--pequeno">
            <label for="ordem_exibicao">Ordem de exibição</label>
            <input type="number" id="ordem_exibicao" formControlName="ordem_exibicao" min="0">
        </div>
        <div class="campo">
            <label>Imagem (opcional)</label>
            <app-upload-imagem [endpoint]="uploadEndpoint" (uploadConcluido)="aoConcluirUpload($event)" />
            @if (imagemUrl()) {
                <img [src]="imagemUrl()" alt="Prévia da imagem da categoria" class="preview-imagem">
            }
        </div>
        <div class="form-categoria__acoes">
            <button type="submit" class="btn-salvar" [disabled]="salvando()">
                {{ editandoId() ? 'Atualizar' : 'Adicionar' }}
            </button>
            @if (editandoId()) {
                <button type="button" class="btn-cancelar" (click)="cancelarEdicao()">Cancelar</button>
            }
        </div>
    </form>

    @if (carregando()) {
        <p>Carregando...</p>
    } @else {
        <app-datatable
            [linhas]="categorias()"
            [colunas]="colunas()"
            [mensagemVazio]="'<span>Nenhuma categoria cadastrada ainda.</span>'"
        />
    }
</div>
