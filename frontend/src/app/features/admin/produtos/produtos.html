<div class="produtos-pagina">
    <div class="produtos-pagina__cabecalho">
        <div>
            <h1>Produtos</h1>
            <p class="produtos-pagina__descricao">Gerencie o catálogo exibido no site.</p>
        </div>
        <a routerLink="/admin/produtos/novo" class="btn-novo">
            <i class="fas fa-plus"></i> Novo produto
        </a>
    </div>

    @if (carregando()) {
        <p>Carregando...</p>
    } @else {
        <app-datatable
            [linhas]="produtos()"
            [colunas]="colunas"
            [mensagemVazio]="'<span>Nenhum produto cadastrado ainda.</span>'"
        />
    }
</div>
