<div class="secoes-pagina">
    <h1>Visibilidade das seções</h1>
    <p class="secoes-pagina__descricao">
        Desligue temporariamente uma seção do site sem precisar apagar o conteúdo dela.
    </p>

    @if (carregando()) {
        <p>Carregando...</p>
    } @else {
        <div class="secoes-lista">
            @for (secao of secoes(); track secao.chave) {
                <div class="secoes-item">
                    <div>
                        <strong>{{ nomeAmigavel(secao.chave) }}</strong>
                        @if (secao.bloqueada) {
                            <span class="secoes-item__badge">sempre visível</span>
                        }
                    </div>
                    <button
                        type="button"
                        class="toggle"
                        [class.ativo]="secao.visivel"
                        [class.desabilitado]="secao.bloqueada"
                        [disabled]="secao.bloqueada"
                        (click)="alternar(secao)"
                    >
                        <span class="toggle__bola"></span>
                    </button>
                </div>
            }
        </div>
    }
</div>
