<div class="upload-imagem">
  <label class="upload-imagem__campo">
    <input
      type="file"
      accept="image/*"
      [multiple]="multiplo()"
      (change)="aoSelecionarArquivo($event)"
      [disabled]="enviando()"
    />
    <span>{{ enviando() ? 'Enviando...' : (multiplo() ? 'Selecionar imagens' : 'Selecionar imagem') }}</span>
  </label>

  <p class="upload-imagem__ajuda">A imagem será ajustada automaticamente para 800x800px no formato WebP para manter o site rápido.</p>

  @if (preview()) {
    <img class="upload-imagem__preview" [src]="preview()" alt="Pré-visualização da imagem" />
  }

  @if (enviando()) {
    <div class="upload-imagem__progresso">
      <div class="upload-imagem__barra" [style.width.%]="progresso()"></div>
    </div>
  }

  @if (erro()) {
    <p class="upload-imagem__erro">{{ erro() }}</p>
  }
</div>
